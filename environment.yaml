name: heegnet
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python 3.10 runtime
  - python=3.10
  - pip
  # Scientific computing
  - numpy>=1.22
  - pandas>=1.4
  - scipy>=1.8
  - scikit-learn>=1.0
  - matplotlib>=3.5
  - seaborn>=0.11
  # Deep learning
  - pytorch>=2.0
  - torchvision
  # Jupyter notebooks
  - ipykernel
  - notebook
  - jupyterlab
  - pip:
      # Manifold optimization & EEG
      - geoopt>=0.5.0
      - moabb
      # NLP & semantic hierarchy
      - nltk>=3.7
      - sentence-transformers>=2.2
      # Local package
      - -e .
